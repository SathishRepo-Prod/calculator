<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            margin-top: 50px;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
            box-shadow: 0 0 10px gray;
        }
        input, select, button {
            margin: 10px;
            padding: 10px;
            width: 80%;
        }
        button {
            background: #007BFF;
            color: white;
            border: none;
        }
        h2 {
            color: green;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Calculator</h1>
    <form method="post">
        <input type="text" name="a" placeholder="Enter first number" required>
        <input type="text" name="b" placeholder="Enter second number" required>

        <select name="operation">
            <option value="add">Add</option>
            <option value="sub">Subtract</option>
            <option value="mul">Multiply</option>
            <option value="div">Divide</option>
        </select>

        <button type="submit">Calculate</button>
    </form>

    {% if result is not none %}
        <h2>Result: {{ result }}</h2>
    {% endif %}
</div>

</body>
</html>
